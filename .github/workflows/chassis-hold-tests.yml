name: Chassis Hold regression
on:
  push:
    branches: [melodic]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout-udp:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [plain, sanitized]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-xrpc
          ref: 4b257c97887b115eafbf20f7739b7072c5dc468d
          path: _dependencies/xrpc
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-state-machine
          ref: c7aa90538b57f0ea8b4741078abcdc911aee693c
          path: _dependencies/state-machine
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-chassis-hold
          ref: 499b5a110545ddba9ce59af5f0f8f792e3040a05
          path: _dependencies/chassis-hold
      - uses: actions/checkout@v4
        with:
          repository: XGC-Team/xgc2-ros-msgs
          ref: b6b6cf96bb1a1a2cc0164bb38cb3a050531bb3be
          path: _dependencies/ros-msgs
      - name: Exercise installed HOLD against pinned SDKs
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e VARIANT -e CC=clang-10 -e CXX=clang++-10 -e CCACHE_DIR=/scratch/ccache \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP:/scratch" \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic@sha256:fce2d76fddf4f6439bf0a188249b731650febdc163befc360bed186b269d252a \
            bash -lc '
              set -euo pipefail
              work="/scratch/chassis-$VARIANT"
              prefix="$work/prefix"
              flags=()
              if [[ "$VARIANT" == sanitized ]]; then
                flags=(-DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
                       -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
                       -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -shared-libasan -Wl,-rpath,$(clang++-10 -print-resource-dir)/lib/linux")
              fi
              for component in state-machine xrpc chassis-hold; do
                components=()
                if [[ "$component" == xrpc ]]; then
                  components=(-DXGC2_XRPC_COMPONENTS=udp)
                elif [[ "$component" == chassis-hold ]]; then
                  components=(-DXGC2_CHASSIS_HOLD_BUILD_HTTP=OFF)
                fi
                cmake -S "/repo/_dependencies/$component" -B "$work/$component" \
                  -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
                  -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix" \
                  "${components[@]}" "${flags[@]}"
                cmake --build "$work/$component" --parallel 2
                cmake --install "$work/$component"
              done
              set +u
              source /opt/ros/noetic/setup.bash
              set -u
              export CMAKE_PREFIX_PATH="$prefix:$CMAKE_PREFIX_PATH"
              export LD_LIBRARY_PATH="$prefix/lib:$(clang++-10 -print-resource-dir)/lib/linux:${LD_LIBRARY_PATH:-}"
              export PATH="$prefix/bin:$PATH"
              mkdir -p "$work/src"
              for package in wrp_io ugv_sdk scout_base; do
                ln -s "/repo/onboard/ros1/chassis/src/$package" "$work/src/$package"
              done
              ln -s /repo/_dependencies/ros-msgs/scout_msgs "$work/src/scout_msgs"
              catkin_make -C "$work" -j2 -DCMAKE_BUILD_TYPE=Debug \
                -DPYTHON_EXECUTABLE=/usr/bin/python3 "${flags[@]}"
              set +u
              source "$work/devel/setup.bash"
              set -u
              if [[ "$VARIANT" == sanitized ]]; then
                export SCOUT_TEST_RUNTIME_PRELOAD="$(find "$(clang++-10 -print-resource-dir)/lib" -name "libclang_rt.asan-*.so" -print -quit)"
              fi
              cmake -S /repo/test -B "$work/consumer" -DCMAKE_PREFIX_PATH="$prefix" \
                -DSCOUT_DEVEL_PREFIX="$work/devel" -DPYTHON_EXECUTABLE=/usr/bin/python3 \
                -DCMAKE_BUILD_TYPE=Debug "${flags[@]}"
              cmake --build "$work/consumer" --parallel 2
              cd "$work/consumer"
              ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
                ctest --output-on-failure
            '
