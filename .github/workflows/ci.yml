name: ci

on:
  push:
    branches:
      - melodic
  pull_request:
    branches:
      - melodic
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package-compliance:
    name: Package compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata
        run: |
          set -euo pipefail
          git diff --check HEAD
          test ! -e .gitmodules
          bash -n .xgc2/scripts/build_debs_in_docker.sh
          bash -n .xgc2/scripts/build_ros2_subset.sh
          bash -n .xgc2/scripts/check_installed_packages.sh
          bash -n .xgc2/scripts/check_installed_ros2_packages.sh
          bash -n .xgc2/scripts/package_debs.sh
          bash -n .xgc2/scripts/check_source_workspace_in_docker.sh

      - name: Build package and run launch compliance
        run: |
          .xgc2/scripts/check_source_workspace_in_docker.sh \
            --image ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0 \
            --work-dir "$RUNNER_TEMP/agilex-onboard-ros1-compliance"

  build-debs:
    name: Build debs (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-bionic-melodic
            os: ubuntu-18.04
            ros_distro: melodic
            distribution: bionic
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
          - name: amd64-bionic-melodic
            os: ubuntu-18.04
            ros_distro: melodic
            distribution: bionic
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
          - name: arm64-focal-noetic
            os: ubuntu-20.04
            ros_distro: noetic
            distribution: focal
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-ros-noetic:1.0.0
          - name: amd64-focal-noetic
            os: ubuntu-20.04
            ros_distro: noetic
            distribution: focal
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-ros-noetic:1.0.0
          - name: arm64-noble-jazzy
            os: ubuntu-24.04
            ros_distro: jazzy
            distribution: noble
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-ros-jazzy:1.0.0
          - name: amd64-noble-jazzy
            os: ubuntu-24.04
            ros_distro: jazzy
            distribution: noble
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-ros-jazzy:1.0.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Record build matrix
        run: |
          cat <<EOF
          ci_matrix_name=${{ matrix.name }}
          os=${{ matrix.os }}
          ros_distro=${{ matrix.ros_distro }}
          distribution=${{ matrix.distribution }}
          arch=${{ matrix.arch }}
          image=${{ matrix.image }}
          EOF

      - name: Build and install-check deb package
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --image "${{ matrix.image }}" \
            --work-dir "$RUNNER_TEMP/xgc2-agilex-onboard-${{ matrix.name }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create trusted build manifest
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-agilex-onboard-ros1 \
            --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-agilex-onboard-debs-${{ matrix.name }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
