name: ci

on:
  push:
    branches:
      - melodic
  pull_request:
    branches:
      - melodic
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package-compliance:
    name: Package compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install metadata check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Check package metadata
        run: |
          set -euo pipefail
          git diff --check HEAD
          bash -n .xgc2/scripts/build_debs_in_docker.sh
          bash -n .xgc2/scripts/check_installed_packages.sh
          bash -n .xgc2/scripts/package_debs.sh
          bash -n .xgc2/scripts/publish_apt_repo.sh
          bash -n .xgc2/scripts/check_source_workspace_in_docker.sh
          xmllint --noout \
            onboard/ros1/src/agilex_onboard_imu/package.xml \
            onboard/ros1/src/agilex_onboard_imu/launch/imu_msg.launch \
            onboard/ros1/src/agilex_onboard_imu/launch/imu_rviz.launch \
            onboard/ros1/src/imu_launch/package.xml \
            onboard/ros1/src/imu_launch/launch/imu_msg.launch \
            onboard/ros1/src/imu_launch/launch/imu_rviz.launch

      - name: Build package and run launch compliance
        run: .xgc2/scripts/check_source_workspace_in_docker.sh --work-dir "$RUNNER_TEMP/agilex-onboard-imu-compliance"

  build-debs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and install-check deb package
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-agilex-onboard-imu-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-agilex-onboard-imu-debs-${{ matrix.arch }}
          path: debs/*.deb
