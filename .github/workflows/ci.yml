name: ci

on:
  push:
    branches:
      - melodic
      - noetic
  pull_request:
    branches:
      - melodic
      - noetic
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package-compliance:
    name: Package compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Check package metadata
        run: |
          set -euo pipefail
          git diff --check HEAD
          test ! -e onboard/ros1/src
          test ! -e onboard/ros1/base
          test ! -e onboard/ros1/chassis/src/autostart
          test ! -e onboard/ros1/chassis/src/communication
          test ! -e onboard/ros1/chassis/src/sensors
          test ! -e onboard/ros1/chassis/src/imu
          test ! -e onboard/ros1/chassis/src/scout_description
          test ! -e onboard/ros1/communication/src/agilex_mocap
          test ! -e onboard/ros1/sensors/src/agilex_mocap
          test ! -e onboard/ros1/sensors/src/viz
          test ! -e onboard/ros1/sensors/src/agilex_onboard_sensors
          test ! -e onboard/ros1/autostart/src/agilex_onboard_autostart/launch/base.launch
          test -d onboard/ros1/chassis/src
          test -d onboard/ros1/communication/src
          test -d onboard/ros1/perception/src
          test ! -e onboard/ros1/perception/src/agilex_mocap
          test -f onboard/ros1/perception/src/agilex_estimator/package.xml
          test -d onboard/ros1/control/src
          test -f onboard/ros1/control/src/agilex_nmpc/package.xml
          test -d onboard/ros1/autostart/src
          test -d onboard/ros1/sensors/src
          test ! -e onboard/ros1/sensors/src/camera
          test -d onboard/ros1/sensors/src/lidar/rslidar_sdk
          test -d onboard/ros1/sensors/src/imu/serial_imu
          test -d onboard/ros1/visualization/src
          test -f onboard/ros1/visualization/src/agilex_onboard_rviz/package.xml
          test ! -e onboard/ros1/visualization/src/agilex_onboard_viz
          test -d onboard/ros1/teleop/src
          test -f onboard/ros1/teleop/src/xgc2_onboard_teleop/package.xml
          test ! -e .gitmodules
          bash -n .xgc2/scripts/build_debs_in_docker.sh
          bash -n .xgc2/scripts/build_sensor_debs_in_docker.sh
          bash -n .xgc2/scripts/check_installed_packages.sh
          bash -n .xgc2/scripts/require_image_ros.sh
          bash -n .xgc2/scripts/fetch_xgc2_runtime_debs.sh
          bash -n .xgc2/scripts/install_local_xgc2_debs.sh
          bash -n .xgc2/scripts/package_debs.sh
          bash -n .xgc2/scripts/package_sensor_debs.sh
          bash -n .xgc2/scripts/check_source_workspace_in_docker.sh
          bash -n onboard/ros1/autostart/src/agilex_onboard_autostart/scripts/start-onboard-teleop
          python3 onboard/ros1/teleop/src/xgc2_onboard_teleop/test/test_layout.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots = [
              Path("onboard/ros1/chassis/src"),
              Path("onboard/ros1/communication/src"),
              Path("onboard/ros1/perception/src"),
              Path("onboard/ros1/control/src"),
              Path("onboard/ros1/autostart/src"),
              Path("onboard/ros1/teleop/src"),
              Path("onboard/ros1/sensors/src"),
              Path("onboard/ros1/visualization/src"),
          ]
          files = []
          names = set()
          for root in roots:
              for path in root.rglob("package.xml"):
                  files.append(path)
                  name = ET.parse(path).getroot().findtext("name")
                  if name:
                      names.add(name)
              files.extend(root.rglob("*.launch"))
          for path in files:
              ET.parse(path)
          declared = []
          in_packages = False
          for line in Path(".xgc2/product.yml").read_text(encoding="utf-8").splitlines():
              if line.startswith("  packages:"):
                  in_packages = True
                  continue
              if in_packages:
                  if line.startswith("  - "):
                      declared.append(line[4:].strip())
                  elif line and not line.startswith("   "):
                      break
          # ros.packages is the vehicle train inventory. Algorithm-layer
          # package.xml files may remain on disk without being this product.
          missing = sorted(set(declared) - names)
          extra = []
          if missing:
              raise SystemExit(
                  f"product.yml ros.packages missing on disk={missing}"
              )
          undeclared = sorted(names - set(declared))
          print(
              f"parsed {len(files)} xml files; {len(declared)} train packages"
              + (f"; source-only {undeclared}" if undeclared else "")
          )
          PY

  build-debs:
    name: Build chassis debs (${{ matrix.name }})
    needs: package-compliance
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-bionic-melodic
            os: ubuntu-18.04
            ros_distro: melodic
            distribution: bionic
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
          - name: amd64-bionic-melodic
            os: ubuntu-18.04
            ros_distro: melodic
            distribution: bionic
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
          - name: arm64-focal-noetic
            os: ubuntu-20.04
            ros_distro: noetic
            distribution: focal
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-ros-noetic:1.0.0
          - name: amd64-focal-noetic
            os: ubuntu-20.04
            ros_distro: noetic
            distribution: focal
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-ros-noetic:1.0.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record build matrix
        run: |
          cat <<EOF
          ci_matrix_name=${{ matrix.name }}
          os=${{ matrix.os }}
          ros_distro=${{ matrix.ros_distro }}
          distribution=${{ matrix.distribution }}
          arch=${{ matrix.arch }}
          image=${{ matrix.image }}
          EOF
      - name: Compile workspace and check launches
        run: |
          .xgc2/scripts/check_source_workspace_in_docker.sh \
            --image "${{ matrix.image }}" \
            --work-dir "$RUNNER_TEMP/agilex-onboard-ros1-compliance-${{ matrix.name }}"
      - name: Build and install-check chassis debs
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --image "${{ matrix.image }}" \
            --work-dir "$RUNNER_TEMP/xgc2-agilex-onboard-${{ matrix.name }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Create trusted build manifest
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-agilex-onboard-ros1 \
            --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - name: Upload chassis deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-agilex-onboard-debs-${{ matrix.name }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  build-sensor-debs:
    name: Build sensor debs (${{ matrix.name }})
    needs: package-compliance
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-bionic-melodic
            distribution: bionic
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-full-melodic:1.0.0
          - name: amd64-bionic-melodic
            distribution: bionic
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-full-melodic:1.0.0
          - name: arm64-focal-noetic
            distribution: focal
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0
          - name: amd64-focal-noetic
            distribution: focal
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build IMU, camera, and lidar debs
        run: |
          .xgc2/scripts/build_sensor_debs_in_docker.sh \
            --image "${{ matrix.image }}" \
            --work-dir "$RUNNER_TEMP/xgc2-agilex-sensors-${{ matrix.name }}" \
            --output-dir "$GITHUB_WORKSPACE/debs-sensors"
      - name: Create trusted build manifest
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs-sensors \
            --output-dir .ci/build-manifests \
            --product xgc2-agilex-onboard-ros1 \
            --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - name: Upload sensor deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-agilex-onboard-sensors-debs-${{ matrix.name }}
          path: |
            debs-sensors/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
