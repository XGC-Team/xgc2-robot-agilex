name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate release inputs
        run: |
          set -euo pipefail
          actual_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_version}" = "${{ inputs.expected_version }}"
          test "${actual_sha}" = "${{ inputs.expected_source_sha }}"

  build-debs:
    name: Build debs (${{ matrix.name }})
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-bionic-melodic
            os: ubuntu-18.04
            ros_distro: melodic
            distribution: bionic
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
          - name: amd64-bionic-melodic
            os: ubuntu-18.04
            ros_distro: melodic
            distribution: bionic
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
          - name: arm64-focal-noetic
            os: ubuntu-20.04
            ros_distro: noetic
            distribution: focal
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-ros-noetic:1.0.0
          - name: amd64-focal-noetic
            os: ubuntu-20.04
            ros_distro: noetic
            distribution: focal
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-ros-noetic:1.0.0
          - name: arm64-noble-jazzy
            os: ubuntu-24.04
            ros_distro: jazzy
            distribution: noble
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-ros-jazzy:1.0.0
          - name: amd64-noble-jazzy
            os: ubuntu-24.04
            ros_distro: jazzy
            distribution: noble
            arch: amd64
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-ros-jazzy:1.0.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and install-check deb package
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --image "${{ matrix.image }}" \
            --work-dir "$RUNNER_TEMP/xgc2-agilex-onboard-${{ matrix.name }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create release-train build manifest
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-agilex-onboard-ros1 \
            --product-version "${{ inputs.expected_version }}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-agilex-onboard-debs-${{ matrix.name }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
