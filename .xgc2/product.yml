schema: xgc2.product.v1
id: xgc2-agilex-onboard-ros1
name: XGC2 AgileX Onboard ROS1
version: 0.2.0-3
kind: ros1-apt
summary: Vehicle-true AgileX Scout Mini minimum runtime (IMU, chassis, and
  ground-station bridge) for Melodic, Noetic, and a Jazzy portable subset.
groups:
- robotics
- agilex
- onboard
ros:
  distro: melodic,noetic,jazzy
  workspace: onboard/ros1
  packages:
  - serial_imu
  - wrp_io
  - ugv_sdk
  - scout_msgs
  - scout_base
  - scout_description
  - swarm_ros_bridge
  - agilex_onboard_autostart
apt:
  distribution: bionic,focal,noble
  install:
  - ros-melodic-xgc2-agilex-onboard-autostart
  packages:
  - ros-melodic-xgc2-agilex-serial-imu
  - ros-melodic-xgc2-agilex-wrp-io
  - ros-melodic-xgc2-agilex-ugv-sdk
  - ros-melodic-xgc2-agilex-scout-msgs
  - ros-melodic-xgc2-agilex-scout-base
  - ros-melodic-xgc2-agilex-scout-description
  - ros-melodic-xgc2-agilex-swarm-ros-bridge
  - ros-melodic-xgc2-agilex-onboard-autostart
  - ros-noetic-xgc2-agilex-serial-imu
  - ros-noetic-xgc2-agilex-wrp-io
  - ros-noetic-xgc2-agilex-ugv-sdk
  - ros-noetic-xgc2-agilex-scout-msgs
  - ros-noetic-xgc2-agilex-scout-base
  - ros-noetic-xgc2-agilex-scout-description
  - ros-noetic-xgc2-agilex-swarm-ros-bridge
  - ros-noetic-xgc2-agilex-onboard-autostart
  - ros-jazzy-xgc2-agilex-wrp-io
  - ros-jazzy-xgc2-agilex-ugv-sdk
  - ros-jazzy-xgc2-agilex-scout-description
  depends:
  - ros-melodic-geometry-msgs
  - ros-melodic-joint-state-publisher
  - ros-melodic-message-runtime
  - ros-melodic-nav-msgs
  - ros-melodic-robot-state-publisher
  - ros-melodic-roscpp
  - ros-melodic-roslaunch
  - ros-melodic-rospy
  - ros-melodic-sensor-msgs
  - ros-melodic-serial
  - ros-melodic-std-msgs
  - ros-melodic-tf
  - ros-melodic-tf2
  - ros-melodic-tf2-ros
  - ros-melodic-topic-tools
  - ros-melodic-xacro
  - libzmqpp-dev
  - iproute2
  - systemd
  - udev
vehicle:
  os: ubuntu-18.04
  ros_distro: melodic
  arch: arm64
usage:
  install: |
    sudo apt update
    sudo apt install ros-melodic-xgc2-agilex-onboard-autostart
  smoke_test: |
    rospack find serial_imu
    rospack find scout_base
    roslaunch --files agilex_onboard_autostart imu.launch
    roslaunch --files agilex_onboard_autostart chassis.launch
    test -f "$(rospack find scout_description)/urdf/scout_v2.xacro"
    rospack find swarm_ros_bridge
    roslaunch --files swarm_ros_bridge test.launch
release:
  workflow: release.yml
  apt_versions:
    bionic: 0.2.0-3
    focal: 0.2.0-3
    noble: 0.2.0-3
