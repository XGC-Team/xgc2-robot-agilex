schema: xgc2.product.v1
id: xgc2-agilex-onboard-ros1
name: XGC2 AgileX Onboard ROS1
version: 0.1.0-1
kind: ros1-apt
summary: ROS Melodic onboard IMU and Scout chassis packages for the AgileX onboard computer.
groups:
- robotics
- agilex
- onboard
ros:
  distro: melodic
  workspace: onboard/ros1
  packages:
  - agilex_onboard_imu
  - imu_launch
  - wrp_io
  - ugv_sdk
  - scout_msgs
  - scout_description
  - scout_base
  - scout_bringup
apt:
  distribution: bionic
  install:
  - ros-melodic-xgc2-agilex-onboard-imu
  - ros-melodic-xgc2-agilex-wrp-io
  - ros-melodic-xgc2-agilex-ugv-sdk
  - ros-melodic-xgc2-agilex-scout-msgs
  - ros-melodic-xgc2-agilex-scout-description
  - ros-melodic-xgc2-agilex-scout-base
  - ros-melodic-xgc2-agilex-scout-bringup
  packages:
  - ros-melodic-xgc2-agilex-onboard-imu
  - ros-melodic-xgc2-agilex-wrp-io
  - ros-melodic-xgc2-agilex-ugv-sdk
  - ros-melodic-xgc2-agilex-scout-msgs
  - ros-melodic-xgc2-agilex-scout-description
  - ros-melodic-xgc2-agilex-scout-base
  - ros-melodic-xgc2-agilex-scout-bringup
  depends:
  - ros-melodic-controller-manager
  - ros-melodic-geometry-msgs
  - ros-melodic-joint-state-publisher
  - ros-melodic-message-runtime
  - ros-melodic-nav-msgs
  - ros-melodic-roscpp
  - ros-melodic-roslaunch
  - ros-melodic-robot-state-publisher
  - ros-melodic-sensor-msgs
  - ros-melodic-serial
  - ros-melodic-std-msgs
  - ros-melodic-tf2
  - ros-melodic-tf2-ros
  - ros-melodic-topic-tools
  - ros-melodic-urdf
  - ros-melodic-xacro
usage:
  install: |
    sudo apt update
    sudo apt install \
      ros-melodic-xgc2-agilex-onboard-imu \
      ros-melodic-xgc2-agilex-scout-bringup
  smoke_test: |
    rospack find agilex_onboard_imu
    roslaunch --files agilex_onboard_imu imu_msg.launch
    rospack find scout_base
    roslaunch --files scout_bringup scout_minimal.launch
  notes: |
    The launch defaults match the recovered vehicle startup chain:
    port=/dev/imu, baud=115200, topic=/imu/data_raw, frame_id=imu_link.
    The deb also provides an imu_launch compatibility package so the recovered
    roslaunch imu_launch imu_msg.launch autostart command still resolves.
    The Scout chassis packages are split by ROS package so SDK, messages,
    description, driver, and bringup can be installed independently.
ownership:
  paths:
  - /opt/ros/melodic/share/agilex_onboard_imu
  - /opt/ros/melodic/share/imu_launch
  - /opt/ros/melodic/lib/agilex_onboard_imu/agilex_onboard_imu_node
  - /opt/ros/melodic/share/wrp_io
  - /opt/ros/melodic/share/ugv_sdk
  - /opt/ros/melodic/share/scout_msgs
  - /opt/ros/melodic/share/scout_description
  - /opt/ros/melodic/share/scout_base
  - /opt/ros/melodic/share/scout_bringup
  - /opt/ros/melodic/lib/scout_base/scout_base_node
release:
  workflow: release.yml
