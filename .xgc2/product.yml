schema: xgc2.product.v1
id: xgc2-agilex-onboard-ros1
name: XGC2 AgileX Onboard ROS1
version: 0.1.1-10
kind: ros1-apt
summary: ROS Melodic onboard IMU, Scout chassis, communication, and sensor packages
  for the AgileX onboard computer.
groups:
- robotics
- agilex
- onboard
ros:
  distro: melodic
  workspace: onboard/ros1
  packages:
  - agilex_onboard_imu
  - wrp_io
  - ugv_sdk
  - scout_base
  - scout_bringup
  - agilex_swarm_ros_bridge
  - realsense2_camera
  - realsense2_description
  - rslidar_sdk
  - agilex_onboard_autostart
apt:
  distribution: bionic
  install:
  - ros-melodic-xgc2-agilex-onboard-imu
  - ros-melodic-xgc2-agilex-wrp-io
  - ros-melodic-xgc2-agilex-ugv-sdk
  - ros-melodic-xgc2-agilex-scout-base
  - ros-melodic-xgc2-agilex-scout-bringup
  - ros-melodic-xgc2-agilex-swarm-ros-bridge
  - ros-melodic-xgc2-agilex-realsense2-camera
  - ros-melodic-xgc2-agilex-realsense2-description
  - ros-melodic-xgc2-agilex-rslidar-sdk
  - ros-melodic-xgc2-agilex-onboard-autostart
  packages:
  - ros-melodic-xgc2-agilex-onboard-imu
  - ros-melodic-xgc2-agilex-wrp-io
  - ros-melodic-xgc2-agilex-ugv-sdk
  - ros-melodic-xgc2-agilex-scout-base
  - ros-melodic-xgc2-agilex-scout-bringup
  - ros-melodic-xgc2-agilex-swarm-ros-bridge
  - ros-melodic-xgc2-agilex-realsense2-camera
  - ros-melodic-xgc2-agilex-realsense2-description
  - ros-melodic-xgc2-agilex-rslidar-sdk
  - ros-melodic-xgc2-agilex-onboard-autostart
  depends:
  - ros-melodic-controller-manager
  - ros-melodic-cv-bridge
  - ros-melodic-ddynamic-reconfigure
  - ros-melodic-diagnostic-updater
  - ros-melodic-genmsg
  - ros-melodic-geometry-msgs
  - ros-melodic-image-transport
  - ros-melodic-message-runtime
  - ros-melodic-nav-msgs
  - ros-melodic-nodelet
  - ros-melodic-pcl-conversions
  - ros-melodic-pcl-ros
  - ros-melodic-roscpp
  - ros-melodic-roslaunch
  - ros-melodic-roslib
  - ros-melodic-rospy
  - ros-melodic-rosgraph
  - ros-melodic-scout-msgs (>= 0.3.3-5)
  - ros-melodic-sensor-msgs
  - ros-melodic-serial
  - ros-melodic-std-msgs
  - ros-melodic-std-srvs
  - ros-melodic-swarm-ros-bridge (>= 1.1.0-2)
  - ros-melodic-tf
  - ros-melodic-tf2
  - ros-melodic-tf2-ros
  - ros-melodic-topic-tools
  - systemd
  - udev
  - iproute2
  - ros-melodic-xacro
  - libpcap-dev
  - libpcl-dev
  - librealsense2-dev
  - libyaml-cpp-dev
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-xgc2-agilex-onboard-autostart

    '
  smoke_test: 'rospack find agilex_onboard_imu

    roslaunch --files agilex_onboard_imu imu_msg.launch

    rospack find scout_base

    roslaunch --files scout_bringup scout_minimal.launch

    rospack find agilex_swarm_ros_bridge

    roslaunch --files agilex_swarm_ros_bridge agilex_swarm_ros_bridge.launch

    '
  notes: 'The launch defaults match the recovered vehicle startup chain:

    port=/dev/imu, baud=115200, topic=/imu/data_raw, frame_id=imu_link.

    The IMU deb also installs a one-time udev setup script for /dev/imu:

    /opt/ros/melodic/share/agilex_onboard_imu/scripts/install_imu_udev_rule.sh.

    The Scout chassis packages are split by ROS package so SDK, messages,

    driver, and bringup can be installed independently. The compatible Scout

    message definitions are maintained in xgc2-scout-msgs and consumed as the

    external Debian package ros-melodic-scout-msgs.

    The AgileX swarm bridge package only provides vehicle-specific YAML and

    launch files. It consumes the external generic package

    ros-melodic-swarm-ros-bridge.

    The onboard sensor packages are grouped under onboard/ros1/src/sensors and

    split into independent Debian packages for RealSense camera, RealSense

    description assets, and RoboSense LiDAR.

    The optional autostart package installs systemd units, the IMU udev rule,

    lightweight ROS readiness probes, and default swarm bridge configuration.

    It enables xgc2-agilex-onboard.target but does not start the target during

    installation.

    Internal Debian dependencies include >= version constraints so driver and

    bringup packages do not silently bind to older SDK/driver packages.

    '
ownership:
  paths:
  - /opt/ros/melodic/share/agilex_onboard_imu
  - /opt/ros/melodic/lib/agilex_onboard_imu/agilex_onboard_imu_node
  - /opt/ros/melodic/share/agilex_onboard_imu/scripts/install_imu_udev_rule.sh
  - /opt/ros/melodic/share/wrp_io
  - /opt/ros/melodic/share/ugv_sdk
  - /opt/ros/melodic/share/scout_base
  - /opt/ros/melodic/share/scout_bringup
  - /opt/ros/melodic/share/agilex_swarm_ros_bridge
  - /opt/ros/melodic/lib/scout_base/scout_base_node
  - /opt/ros/melodic/share/realsense2_camera
  - /opt/ros/melodic/share/realsense2_description
  - /opt/ros/melodic/share/rslidar_sdk
  - /opt/ros/melodic/lib/rslidar_sdk/rslidar_sdk_node
  - /opt/ros/melodic/share/agilex_onboard_autostart
  - /opt/ros/melodic/lib/agilex_onboard_autostart/start-imu
  - /lib/systemd/system/xgc2-agilex-onboard.target
  - /etc/udev/rules.d/99-xgc2-agilex-imu.rules
  - /etc/xgc2/agilex/swarm_ros_bridge/ros_topics.yaml
release:
  workflow: release.yml
