schema: xgc2.product.v1
id: xgc2-agilex-onboard-ros1
name: XGC2 AgileX Onboard ROS1
version: 0.2.0-16
kind: ros1-apt
summary: Vehicle-true AgileX Scout Mini minimum runtime (IMU, chassis, and
  ground-station bridge) for Melodic and Noetic.
groups:
- robotics
- agilex
- onboard
ros:
  distro: melodic,noetic
  workspace: onboard/ros1/base
  packages:
  - serial_imu
  - wrp_io
  - ugv_sdk
  - scout_base
  - agilex_swarm_ros_bridge
  - agilex_mocap
  - agilex_onboard_autostart
apt:
  distribution: bionic,focal
  install:
  - ros-melodic-xgc2-agilex
  packages:
  - ros-melodic-xgc2-agilex
  - ros-melodic-xgc2-agilex-chassis
  - ros-melodic-xgc2-agilex-serial-imu
  - ros-melodic-xgc2-agilex-wrp-io
  - ros-melodic-xgc2-agilex-ugv-sdk
  - ros-melodic-xgc2-agilex-scout-base
  - ros-melodic-xgc2-agilex-swarm-ros-bridge
  - ros-melodic-xgc2-agilex-mocap
  - ros-melodic-xgc2-agilex-onboard-autostart
  - ros-noetic-xgc2-agilex
  - ros-noetic-xgc2-agilex-chassis
  - ros-noetic-xgc2-agilex-serial-imu
  - ros-noetic-xgc2-agilex-wrp-io
  - ros-noetic-xgc2-agilex-ugv-sdk
  - ros-noetic-xgc2-agilex-scout-base
  - ros-noetic-xgc2-agilex-swarm-ros-bridge
  - ros-noetic-xgc2-agilex-mocap
  - ros-noetic-xgc2-agilex-onboard-autostart
  depends:
  - ros-melodic-scout-msgs
  - ros-noetic-scout-msgs
  - ros-melodic-xgc2-scout-description
  - ros-noetic-xgc2-scout-description
  - ros-melodic-swarm-ros-bridge
  - ros-noetic-swarm-ros-bridge
  - ros-melodic-geometry-msgs
  - ros-melodic-joint-state-publisher
  - ros-melodic-message-runtime
  - ros-melodic-nav-msgs
  - ros-melodic-robot-state-publisher
  - ros-melodic-roscpp
  - ros-melodic-roslaunch
  - ros-melodic-rospy
  - ros-melodic-sensor-msgs
  - ros-melodic-serial
  - ros-melodic-std-msgs
  - ros-melodic-tf
  - ros-melodic-tf2
  - ros-melodic-tf2-ros
  - ros-melodic-topic-tools
  - libzmqpp-dev
  - iproute2
  - systemd
  - udev
  - xgc2-utils-linux-timezone
  - xgc2-utils-linux-performance-mode
  - xgc2-vrpn-relay
  - ros-melodic-xgc2-estimator-rigid-state
  - ros-noetic-xgc2-estimator-rigid-state
  - ros-melodic-xgc2-ugv-controller
  - ros-noetic-xgc2-ugv-controller
vehicle:
  os: ubuntu-18.04
  ros_distro: melodic
  arch: arm64
usage:
  install: |
    sudo apt update
    sudo apt install ros-melodic-xgc2-agilex
    sudo apt install ros-noetic-xgc2-agilex-chassis
    sudo apt install ros-noetic-xgc2-agilex-onboard-autostart
  smoke_test: |
    rospack find serial_imu
    rospack find scout_msgs
    rospack find scout_base
    roslaunch --files agilex_onboard_autostart base.launch
    roslaunch --files agilex_onboard_autostart imu.launch
    roslaunch --files agilex_onboard_autostart chassis.launch
    test -f "$(rospack find scout_description)/urdf/scout_visual.urdf"
    rospack find swarm_ros_bridge
    roslaunch --files agilex_swarm_ros_bridge swarm.launch
release:
  workflow: release.yml
  dependency_policy:
    xgc2-scout-msgs: rebuild
    xgc2-scout-description: verify
    xgc2-swarm-ros-bridge: verify
    xgc2-linux-utils: verify
    xgc2-vrpn-relay: verify
    xgc2-estimator-rigid-state: verify
    xgc2-ugv-controller: verify
  apt_versions:
    bionic: 0.2.0-16
    focal: 0.2.0-16
