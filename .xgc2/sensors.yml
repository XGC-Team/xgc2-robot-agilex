schema: xgc2.product.v1
id: xgc2-agilex-onboard-sensors
name: XGC2 AgileX Onboard Sensors
version: 0.1.0-2
kind: ros1-apt
summary: Optional D435i and RoboSense Helios 16 runtime. Not part of the
  minimum boot target.
groups:
- robotics
- agilex
- sensors
ros:
  distro: melodic,noetic
  workspace: onboard/ros1/sensors
  packages:
  - realsense2_camera
  - realsense2_description
  - rslidar_sdk
  - agilex_d435_media
  - agilex_onboard_sensors
apt:
  distribution: bionic,focal
  install:
  - ros-melodic-xgc2-agilex-onboard-sensors
  packages:
  - ros-melodic-xgc2-agilex-realsense2-camera
  - ros-melodic-xgc2-agilex-realsense2-description
  - ros-melodic-xgc2-agilex-rslidar-sdk
  - ros-melodic-xgc2-agilex-d435-media
  - ros-melodic-xgc2-agilex-onboard-sensors
  - ros-noetic-xgc2-agilex-realsense2-camera
  - ros-noetic-xgc2-agilex-realsense2-description
  - ros-noetic-xgc2-agilex-rslidar-sdk
  - ros-noetic-xgc2-agilex-d435-media
  - ros-noetic-xgc2-agilex-onboard-sensors
vehicle:
  os: ubuntu-18.04
  ros_distro: melodic
  arch: arm64
usage:
  install: |
    sudo apt install ros-melodic-xgc2-agilex-onboard-sensors
  smoke_test: |
    roslaunch --files agilex_onboard_sensors camera.launch
    roslaunch --files agilex_onboard_sensors lidar.launch
    test -f "$(rospack find agilex_onboard_sensors)/rviz/sensors.rviz"
release:
  workflow: ci.yml
  apt_versions:
    bionic: 0.1.0-2
    focal: 0.1.0-2
