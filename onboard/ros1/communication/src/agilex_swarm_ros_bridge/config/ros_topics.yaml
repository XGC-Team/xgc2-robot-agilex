### Official swarm_ros_bridge: ZMQ PUB/SUB over TCP.
### send binds tcp://*:srcPort — any GCS can SUB IMU / voltage / chassis.
### recv connects tcp://peer:srcPort — one recv_topics row per GCS that may
### publish /cmd_vel. Last octets 150 / 199 / 251 are XGC1 Scout Lab,
### XGC1 Mecanum Lab, and the XGC2 station. Do not ship a field LAN prefix;
### configure-linux.sh writes the real /24. Placeholders stay on loopback.
### XGC1 uses Imu + PowerVoltage + cmd_vel. chassis_state :3003 is XGC2-only;
### an older XGC1 ground simply does not subscribe that port.
### Two stations sending /cmd_vel at once is last-writer-wins; do not dual-drive.
### recv max_freq is required by bridge_node; 0 means no extra throttle.

IP:
  self: '*'
  gcs150: 127.0.0.1
  gcs199: 127.0.0.1
  gcs251: 127.0.0.1
  qgc: 127.0.0.1
  gcs: 127.0.0.1
  test_local: 127.0.0.1

send_topics:
- topic_name: /imu/data_raw
  msg_type: sensor_msgs/Imu
  max_freq: 20
  srcIP: self
  srcPort: 3001
- topic_name: /PowerVoltage
  msg_type: std_msgs/Float32
  max_freq: 1
  srcIP: self
  srcPort: 3002
- topic_name: /scout/chassis_state
  msg_type: std_msgs/UInt32
  max_freq: 1
  srcIP: self
  srcPort: 3003

recv_topics:
- topic_name: /cmd_vel
  msg_type: geometry_msgs/Twist
  max_freq: 0
  srcIP: gcs150
  srcPort: 3001
- topic_name: /cmd_vel
  msg_type: geometry_msgs/Twist
  max_freq: 0
  srcIP: gcs199
  srcPort: 3001
- topic_name: /cmd_vel
  msg_type: geometry_msgs/Twist
  max_freq: 0
  srcIP: gcs251
  srcPort: 3001
